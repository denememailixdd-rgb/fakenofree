<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Internet Data Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --primary-light: #d1fae5;
            --secondary: #0ea5e9;
            --accent: #f59e0b;
            --text: #1f2937;
            --text-light: #6b7280;
            --light-bg: #f8fafc;
            --card-bg: #ffffff;
            --success: #22c55e;
            --warning: #f59e0b;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --radius: 16px;
            --radius-sm: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--light-bg);
            color: var(--text);
            line-height: 1.6;
            transition: opacity ease-in 0.2s;
        }

        body[unresolved] {
            opacity: 0;
            display: block;
            overflow: hidden;
            position: relative;
        }

        /* Header Styles */
        header {
            background: var(--card-bg);
            padding: 16px 24px;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow-sm);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            font-size: 28px;
        }

        .nav-links {
            display: flex;
            gap: 32px;
        }

        .nav-links a {
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
            position: relative;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background-color: var(--primary);
            transition: width 0.3s;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        /* Hero Section */
        .hero {
            margin-top: 80px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 100px 24px;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" opacity="0.1"><polygon fill="white" points="0,1000 1000,0 1000,1000"/></svg>');
            background-size: cover;
        }

        .hero-content {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 24px;
            font-weight: 700;
            line-height: 1.2;
        }

        .hero p {
            font-size: 1.25rem;
            margin-bottom: 40px;
            opacity: 0.9;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Features Section */
        .features {
            padding: 100px 24px;
            background: var(--card-bg);
        }

        .features-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 60px;
            color: var(--text);
            position: relative;
        }

        .section-title::after {
            content: '';
            position: absolute;
            width: 80px;
            height: 4px;
            background: var(--primary);
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 2px;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 40px;
        }

        .feature-card {
            padding: 40px 30px;
            border-radius: var(--radius);
            background: var(--light-bg);
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .feature-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow);
        }

        .feature-icon {
            font-size: 48px;
            color: var(--primary);
            margin-bottom: 24px;
            display: inline-flex;
            width: 80px;
            height: 80px;
            background: var(--primary-light);
            border-radius: 50%;
            align-items: center;
            justify-content: center;
        }

        .feature-card h3 {
            font-size: 1.5rem;
            margin-bottom: 16px;
            color: var(--text);
        }

        .feature-card p {
            color: var(--text-light);
        }

        /* Form Section */
        .form-section {
            background: var(--card-bg);
            max-width: 700px;
            margin: 80px auto;
            padding: 60px 50px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .form-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
        }

        .form-section h2 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2rem;
            color: var(--text);
        }

        .form-group {
            margin-bottom: 28px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 500;
            color: var(--text);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 16px 18px;
            border: 2px solid #e5e7eb;
            border-radius: var(--radius-sm);
            font-size: 16px;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
            outline: none;
        }

        /* Success Section */
        .success-section {
            background: var(--card-bg);
            max-width: 600px;
            margin: 80px auto;
            padding: 60px 50px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .success-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(to right, var(--success), var(--primary));
        }

        .success-section h3 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: var(--success);
        }

        .success-section p {
            color: var(--text-light);
            margin-bottom: 30px;
        }

        /* Statistics Section */
        .statistics {
            padding: 80px 24px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .stats-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 40px;
            text-align: center;
        }

        .stat-item {
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: var(--radius);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat-number {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* How It Works Section */
        .how-it-works {
            padding: 100px 24px;
            background: var(--card-bg);
        }

        .steps-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 40px;
            margin-bottom: 60px;
            padding: 40px;
            border-radius: var(--radius);
            background: var(--light-bg);
            transition: transform 0.3s;
        }

        .step:hover {
            transform: translateX(10px);
        }

        .step:nth-child(even) {
            flex-direction: row-reverse;
        }

        .step:nth-child(even):hover {
            transform: translateX(-10px);
        }

        .step-number {
            width: 70px;
            height: 70px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .step-content {
            flex: 1;
        }

        .step-content h3 {
            font-size: 1.5rem;
            margin-bottom: 12px;
            color: var(--text);
        }

        .step-content p {
            color: var(--text-light);
        }

        /* Testimonials Section */
        .testimonials {
            padding: 100px 24px;
            background: var(--light-bg);
        }

        .testimonials-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 40px;
        }

        .testimonial-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            transition: transform 0.3s;
        }

        .testimonial-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow);
        }

        .testimonial-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .testimonial-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
        }

        .testimonial-header h4 {
            font-size: 1.25rem;
            margin-bottom: 5px;
        }

        .testimonial-header p {
            color: var(--primary);
            font-weight: 500;
        }

        .testimonial-card p {
            color: var(--text-light);
            font-style: italic;
        }

        /* Buttons */
        .button {
            display: inline-block;
            padding: 16px 36px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s;
            cursor: pointer;
            border: none;
            text-align: center;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
        }

        .button-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 6px rgba(16, 185, 129, 0.3);
        }

        .button-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 10px rgba(16, 185, 129, 0.4);
        }

        .button-secondary {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary);
        }

        .button-secondary:hover {
            background: var(--primary);
            color: white;
        }

        /* Footer */
        footer {
            background: var(--text);
            color: white;
            padding: 80px 24px 40px;
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 60px;
        }

        .footer-section h3 {
            color: white;
            margin-bottom: 24px;
            font-size: 1.25rem;
            position: relative;
            padding-bottom: 10px;
        }

        .footer-section h3::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 3px;
            background: var(--primary);
            bottom: 0;
            left: 0;
            border-radius: 2px;
        }

        .footer-links {
            list-style: none;
        }

        .footer-links li {
            margin-bottom: 12px;
        }

        .footer-links a {
            color: #d1d5db;
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer-links a:hover {
            color: var(--primary);
        }

        .social-links {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .social-links a {
            color: white;
            font-size: 24px;
            transition: color 0.3s, transform 0.3s;
        }

        .social-links a:hover {
            color: var(--primary);
            transform: translateY(-3px);
        }

        .footer-section p {
            color: #d1d5db;
            margin-bottom: 20px;
        }

        .footer-section .form-group input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }

        .footer-section .form-group input::placeholder {
            color: #9ca3af;
        }

        .footer-section .form-group input:focus {
            border-color: var(--primary);
        }

        .footer-bottom {
            text-align: center;
            margin-top: 60px;
            padding-top: 30px;
            border-top: 1px solid #374151;
            color: #9ca3af;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }

            .nav-links {
                display: none;
            }

            .step {
                flex-direction: column !important;
                text-align: center;
                gap: 20px;
            }

            .step:hover {
                transform: translateY(-5px);
            }

            .form-section {
                padding: 40px 30px;
            }

            .features-grid,
            .testimonials-container {
                grid-template-columns: 1fr;
            }

            .footer-container {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .footer-section h3::after {
                left: 50%;
                transform: translateX(-50%);
            }

            .social-links {
                justify-content: center;
            }

            .section-title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">
                <i class="fas fa-wifi"></i>
                Free Internet
            </div>
            <nav class="nav-links">
                <a href="#features">Features</a>
                <a href="#how-it-works">How It Works</a>
                <a href="#testimonials">Testimonials</a>
                <a href="#claim">Get Started</a>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>Get 15GB Free Internet Today!</h1>
            <p>Join millions of satisfied users who've already claimed their free data. Limited time offer!</p>
            <a href="#claim" class="button button-primary">Claim Your Free Data</a>
        </div>
    </section>
    
    <section class="form-section" id="claim">
        <h2>Claim Your Free 15GB Now</h2>
        <form id="data-form">
            <div class="form-group">
                <label for="country">Country Code</label>
                <select id="country" required>
                    <option>Select Country 🌎</option>    	
                    <option value="+213">🇩🇿 +213 (Algeria)</option>
                    <option value="+91">🇮🇳 +91 (India)</option>

                    <option value="+44">🇬🇧 +44 (UK)</option>
                    <option value="+61">🇦🇺 +61 (Australia)</option>
                    <option value="+49">🇩🇪 +49 (Germany)</option>
                    <option value="+33">🇫🇷 +33 (France)</option>
                    <option value="+39">🇮🇹 +39 (Italy)</option>
                    <option value="+34">🇪🇸 +34 (Spain)</option>
                    <option value="+81">🇯🇵 +81 (Japan)</option>
                    <option value="+55">🇧🇷 +55 (Brazil)</option>
                    <option value="+7">🇷🇺 +7 (Russia)</option>
                    <option value="+86">🇨🇳 +86 (China)</option>
                    <option value="+27">🇿🇦 +27 (South Africa)</option>
                    <option value="+52">🇲🇽 +52 (Mexico)</option>
                    <option value="+82">🇰🇷 +82 (South Korea)</option>
                    <option value="+20">🇪🇬 +20 (Egypt)</option>
                    <option value="+31">🇳🇱 +31 (Netherlands)</option>
                    <option value="+46">🇸🇪 +46 (Sweden)</option>
                    <option value="+56">🇨🇱 +56 (Chile)</option>
                    <option value="+41">🇨🇭 +41 (Switzerland)</option>
                    <option value="+65">🇸🇬 +65 (Singapore)</option>
                    <option value="+60">🇲🇾 +60 (Malaysia)</option>
                    <option value="+971">🇦🇪 +971 (UAE)</option>
                    <option value="+63">🇵🇭 +63 (Philippines)</option>
                    <option value="+92">🇵🇰 +92 (Pakistan)</option>
                    <option value="+234">🇳🇬 +234 (Nigeria)</option>
                    <option value="+90">🇹🇷 +90 (Turkey)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="operator">SIM Provider</label>
